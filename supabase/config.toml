[auth]
site_url = "https://matrix-nova.com"
additional_redirect_urls = [
  "https://matrix-nova.com/**",
  "https://hackflow-2026.pages.dev/**",
  "http://localhost:5173/**",
  "http://localhost:3000/**",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.admin-users]
verify_jwt = true
